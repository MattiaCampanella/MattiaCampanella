name: profile-forge

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads config.json at the root of this repo. Everything (theme, layout, options) lives there.
      - uses: GiuseppeBellamacina/profile-forge@main
        with:
          # Optional: a classic PAT (read:user + repo) saved as the secret PROFILE_FORGE_TOKEN
          # to count private contributions. Without it the default token only sees public data.
          token: ${{ secrets.PROFILE_FORGE_TOKEN || github.token }}
          output_dir: assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile card" && git pull --rebase && git push)
